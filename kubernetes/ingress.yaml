apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enterprise-devops-ingress
  namespace: enterprise-devops
spec:
  ingressClassName: nginx
  rules:
    - host: enterprise-devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enterprise-devops-web
                port:
                  number: 80

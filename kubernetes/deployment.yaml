apiVersion: apps/v1
kind: Deployment
metadata:
  generation: 1
  labels:
    app: enterprise-devops-web
  name: enterprise-devops-web
  namespace: enterprise-devops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enterprise-devops-web
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: enterprise-devops-web
    spec:
      containers:
      - image: sawwi/enterprise-devops-web:2.0
        imagePullPolicy: IfNotPresent
        name: web
        ports:
          - containerPort: 80
            protocol: TCP
